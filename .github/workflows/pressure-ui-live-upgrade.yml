name: PRESSURE // OFF Live Profile Upgrade
on:
  push:
    branches: [pressure-ui-live-upgrade]
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch existing three files
        shell: python
        run: |
          from pathlib import Path
          js = Path('script.js').read_text(encoding='utf-8')
          css = Path('style.css').read_text(encoding='utf-8')
          J = r'''

/* PRESSURE SOCIAL SETTINGS UPGRADE v2 */
(() => {
  if (window.__pressureSocialV2) return; window.__pressureSocialV2 = true;
  const S={friends:[],requests:[],selected:null,messages:[],prefs:{theme:'midnight',accent:'#5B8CFF',density:'comfortable',reducedMotion:false,pressureAnimations:true,notifications:true}};
  const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const me=()=>window.currentUser||currentUser, prof=()=>window.currentProfile||currentProfile;
  const el=id=>document.getElementById(id);
  function ui(){
    if(el('pressureSocialV2')) return;
    const m=document.createElement('div');m.id='pressureSocialV2';m.className='psv2 hidden';m.innerHTML=`<div class="psv2-bg" data-psclose></div><section class="psv2-panel"><header><div><small>PRESSURE // OFF</small><h2>Profile Hub</h2><p>Personalize your dashboard and stay connected.</p></div><button data-psclose>×</button></header><nav><button data-tab="appearance">⚙ Appearance</button><button data-tab="friends">👥 Friends <b id="psv2Req"></b></button><button data-tab="chat">💬 Chat</button><button data-tab="account">🔐 Account</button></nav><main>
      <div data-view="appearance" class="psv2-view"><div class="psv2-grid"><label>Theme<select id="psv2Theme"><option value="midnight">Midnight</option><option value="light">Light</option></select></label><label>Accent<input id="psv2Accent" type="color"></label><label>Density<select id="psv2Density"><option value="compact">Compact</option><option value="comfortable">Comfortable</option><option value="cozy">Cozy</option></select></label><label>Reduced motion<input id="psv2Motion" type="checkbox"></label><label>Pressure animations<input id="psv2Anim" type="checkbox"></label><label>Notifications<input id="psv2Notify" type="checkbox"></label></div><button class="psv2-primary" id="psv2SavePrefs">Save preferences</button><span id="psv2Status"></span></div>
      <div data-view="friends" class="psv2-view"><div class="psv2-search"><input id="psv2Search" placeholder="Search username..."><button class="psv2-primary" id="psv2SearchBtn">Search</button></div><div id="psv2Results"></div><h4>Requests</h4><div id="psv2Requests"></div><h4>Friends</h4><div id="psv2Friends"></div></div>
      <div data-view="chat" class="psv2-view"><div class="psv2-chat"><aside id="psv2ChatFriends"></aside><section><strong id="psv2ChatTitle">Select a friend</strong><div id="psv2Messages"></div><form id="psv2Form"><input id="psv2Message" maxlength="2000" placeholder="Message..."><button class="psv2-primary">Send</button></form></section></div></div>
      <div data-view="account" class="psv2-view"><div class="psv2-account"><label>Display name<input id="psv2Name" maxlength="80"></label><button class="psv2-primary" id="psv2SaveName">Save name</button></div><div class="psv2-danger"><div><b>Delete my account</b><p>Permanently removes your account and associated data.</p></div><button id="psv2Delete">Delete account</button></div></div>
    </main></section>`;document.body.appendChild(m);
    const b=document.createElement('button');b.id='psv2Open';b.className='ghost-button';b.type='button';b.textContent='⚙ Appearance & Social';b.onclick=()=>open('appearance');document.querySelector('#profilePage .profile-topbar')?.appendChild(b);
    m.querySelectorAll('[data-psclose]').forEach(x=>x.onclick=()=>m.classList.add('hidden'));m.querySelectorAll('nav button').forEach(x=>x.onclick=()=>open(x.dataset.tab));
    el('psv2SavePrefs').onclick=savePrefs;el('psv2SearchBtn').onclick=search;el('psv2Search').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();search()}};el('psv2Form').onsubmit=send;el('psv2SaveName').onclick=saveName;el('psv2Delete').onclick=del;
  }
  function apply(){document.documentElement.style.setProperty('--blue',S.prefs.accent);document.body.dataset.pressureTheme=S.prefs.theme;document.body.dataset.pressureDensity=S.prefs.density;document.body.classList.toggle('pressure-reduced-motion',S.prefs.reducedMotion);document.body.classList.toggle('pressure-no-animations',!S.prefs.pressureAnimations)}
  function loadPrefs(){S.prefs={...S.prefs,...(prof()?.preferences||{})};el('psv2Theme').value=S.prefs.theme;el('psv2Accent').value=S.prefs.accent;el('psv2Density').value=S.prefs.density;el('psv2Motion').checked=!!S.prefs.reducedMotion;el('psv2Anim').checked=S.prefs.pressureAnimations!==false;el('psv2Notify').checked=S.prefs.notifications!==false;el('psv2Name').value=prof()?.name||'';apply()}
  async function savePrefs(){S.prefs={theme:el('psv2Theme').value,accent:el('psv2Accent').value,density:el('psv2Density').value,reducedMotion:el('psv2Motion').checked,pressureAnimations:el('psv2Anim').checked,notifications:el('psv2Notify').checked};const {error}=await supabaseClient.from('profiles').update({preferences:S.prefs}).eq('id',me().id);if(error)return alert(error.message);if(currentProfile)currentProfile.preferences=S.prefs;apply();el('psv2Status').textContent='Saved ✓';}
  function open(tab){ui();el('pressureSocialV2').classList.remove('hidden');document.querySelectorAll('#pressureSocialV2 .psv2-view').forEach(v=>v.classList.toggle('active',v.dataset.view===tab));document.querySelectorAll('#pressureSocialV2 nav button').forEach(v=>v.classList.toggle('active',v.dataset.tab===tab));loadPrefs();if(tab==='friends'||tab==='chat')loadSocial()}
  async function loadSocial(){if(!me())return;const {data,error}=await supabaseClient.from('friendships').select('id,requester_id,addressee_id,status,updated_at').or(`requester_id.eq.${me().id},addressee_id.eq.${me().id}`);if(error)return;const ids=[...new Set((data||[]).flatMap(x=>[x.requester_id,x.addressee_id]).filter(x=>x!==me().id))];let people=[];if(ids.length){const r=await supabaseClient.from('profiles').select('id,username,name,role').in('id',ids);people=r.data||[]}const map=new Map(people.map(x=>[x.id,x]));S.friends=(data||[]).filter(x=>x.status==='accepted').map(x=>({...x,person:map.get(x.requester_id===me().id?x.addressee_id:x.requester_id)})).filter(x=>x.person);S.requests=(data||[]).filter(x=>x.status==='pending'&&x.addressee_id===me().id).map(x=>({...x,person:map.get(x.requester_id)})).filter(x=>x.person);render();}
  function person(x,button=''){return `<div class="psv2-person"><span class="psv2-avatar">${esc((x.name||x.username||'?')[0].toUpperCase())}</span><div><b>${esc(x.name||x.username)}</b><small>@${esc(x.username)}</small></div>${button}</div>`}
  function render(){el('psv2Req').textContent=S.requests.length||'';el('psv2Requests').innerHTML=S.requests.length?S.requests.map(x=>person(x.person,`<button class="psv2-primary" data-acc="${x.id}">Accept</button><button class="psv2-secondary" data-dec="${x.id}">Decline</button>`)).join(''):'<i>No pending requests.</i>';el('psv2Friends').innerHTML=S.friends.length?S.friends.map(x=>person(x.person,`<button class="psv2-secondary" data-chat="${x.person.id}">Chat</button>`)).join(''):'<i>No friends yet.</i>';document.querySelectorAll('[data-acc]').forEach(b=>b.onclick=()=>friendUpdate(b.dataset.acc,'accepted'));document.querySelectorAll('[data-dec]').forEach(b=>b.onclick=()=>friendUpdate(b.dataset.dec,'declined'));document.querySelectorAll('[data-chat]').forEach(b=>b.onclick=()=>{open('chat');select(b.dataset.chat)});renderChatFriends()}
  async function friendUpdate(id,status){const {error}=await supabaseClient.from('friendships').update({status,updated_at:new Date().toISOString()}).eq('id',id);if(error)return alert(error.message);loadSocial()}
  async function search(){const t=el('psv2Search').value.trim();if(t.length<2)return;const {data,error}=await supabaseClient.from('profiles').select('id,username,name,role').ilike('username',`%${t}%`).neq('id',me().id).limit(12);if(error)return alert(error.message);el('psv2Results').innerHTML=(data||[]).map(p=>person(p,S.friends.some(f=>f.person.id===p.id)?'<span>Friends</span>':`<button class="psv2-primary" data-add="${p.id}">Add</button>`)).join('')||'<i>No users found.</i>';document.querySelectorAll('[data-add]').forEach(b=>b.onclick=async()=>{const r=await supabaseClient.from('friendships').insert({requester_id:me().id,addressee_id:b.dataset.add,status:'pending'});if(r.error)alert(r.error.code==='23505'?'Request already exists.':r.error.message);else{await loadSocial();search()}})}
  function renderChatFriends(){const box=el('psv2ChatFriends');if(!box)return;box.innerHTML=S.friends.map(x=>`<button class="psv2-chat-friend ${S.selected?.id===x.person.id?'active':''}" data-cf="${x.person.id}">${esc(x.person.name||x.person.username)}</button>`).join('')||'<i>Add friends first.</i>';box.querySelectorAll('[data-cf]').forEach(b=>b.onclick=()=>select(b.dataset.cf))}
  async function select(id){const p=S.friends.find(x=>x.person.id===id)?.person;if(!p)return;S.selected=p;renderChatFriends();el('psv2ChatTitle').textContent=`${p.name||p.username} · @${p.username}`;const r=await supabaseClient.from('messages').select('id,sender_id,receiver_id,body,created_at').or(`and(sender_id.eq.${me().id},receiver_id.eq.${id}),and(sender_id.eq.${id},receiver_id.eq.${me().id})`).order('created_at');if(r.error)return alert(r.error.message);S.messages=r.data||[];renderMessages()}
  function renderMessages(){el('psv2Messages').innerHTML=S.messages.length?S.messages.map(m=>`<div class="psv2-msg ${m.sender_id===me().id?'mine':''}">${esc(m.body)}<small>${new Date(m.created_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</small></div>`).join(''):'<i>No messages yet. Say hi 👋</i>';el('psv2Messages').scrollTop=el('psv2Messages').scrollHeight}
  async function send(e){e.preventDefault();const body=el('psv2Message').value.trim();if(!body||!S.selected)return;const r=await supabaseClient.from('messages').insert({sender_id:me().id,receiver_id:S.selected.id,body});if(r.error)return alert(r.error.message);el('psv2Message').value=''}
  async function saveName(){const name=el('psv2Name').value.trim();const r=await supabaseClient.from('profiles').update({name}).eq('id',me().id);if(r.error)return alert(r.error.message);if(currentProfile)currentProfile.name=name;if(typeof updateProfileUI==='function')updateProfileUI();alert('Name saved.')}
  async function del(){if(!confirm('Permanently delete your account? This cannot be undone.'))return;const {data:{session}}=await supabaseClient.auth.getSession();if(!session)return alert('Session expired.');const r=await fetch(`${SUPABASE_URL}/functions/v1/delete-my-account`,{method:'POST',headers:{Authorization:`Bearer ${session.access_token}`,'Content-Type':'application/json'}});const out=await r.json().catch(()=>({}));if(!r.ok)return alert(out.error||'Could not delete account.');await supabaseClient.auth.signOut();location.reload()}
  function realtime(){if(!me()||S.rt)return;S.rt=supabaseClient.channel('pressure-social-v2-'+me().id).on('postgres_changes',{event:'*',schema:'public',table:'friendships'},()=>loadSocial()).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},p=>{const m=p.new;if(S.selected&&(m.sender_id===S.selected.id||m.receiver_id===S.selected.id)){S.messages.push(m);renderMessages()}}).subscribe()}
  window.openPressurePanel=open;window.pressureSocialInit=()=>{ui();realtime();loadPrefs()};document.addEventListener('DOMContentLoaded',()=>setTimeout(window.pressureSocialInit,400));
})();
'''
          C = r'''

/* PRESSURE SOCIAL SETTINGS CSS v2 */
#pressureSocialV2.hidden{display:none}.psv2{position:fixed;inset:0;z-index:10000;display:grid;place-items:center;padding:18px}.psv2-bg{position:absolute;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(10px)}.psv2-panel{position:relative;width:min(960px,100%);max-height:92vh;overflow:hidden;background:#10172a;border:1px solid rgba(255,255,255,.1);border-radius:24px;box-shadow:0 30px 100px rgba(0,0,0,.5);display:flex;flex-direction:column}.psv2-panel header{display:flex;justify-content:space-between;padding:24px;border-bottom:1px solid rgba(255,255,255,.07)}.psv2-panel header h2{margin:3px 0;font-size:28px}.psv2-panel header p{margin:4px 0;opacity:.55;font-size:12px}.psv2-panel header button{border:0;background:rgba(255,255,255,.07);color:inherit;border-radius:10px;width:38px;height:38px;font-size:23px}.psv2-panel nav{display:flex;gap:6px;padding:10px 15px;border-bottom:1px solid rgba(255,255,255,.07);overflow:auto}.psv2-panel nav button{border:0;background:transparent;color:inherit;padding:10px 12px;border-radius:10px;white-space:nowrap;opacity:.55}.psv2-panel nav button.active{opacity:1;background:rgba(91,140,255,.14);color:var(--blue,#5B8CFF)}.psv2-panel main{overflow:auto;padding:20px}.psv2-view{display:none}.psv2-view.active{display:block}.psv2-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.psv2-grid label,.psv2-account label{display:flex;flex-direction:column;gap:7px;padding:15px;border:1px solid rgba(255,255,255,.07);border-radius:14px;background:rgba(255,255,255,.025);font-size:11px;opacity:.8}.psv2-grid select,.psv2-account input,.psv2-search input,.psv2-chat section input{padding:10px;border-radius:9px;border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.18);color:inherit}.psv2-grid input[type=color]{width:48px;height:32px;padding:0;border:0}.psv2-grid input[type=checkbox]{accent-color:var(--blue,#5B8CFF);align-self:flex-start}.psv2-primary,.psv2-secondary,#psv2Delete{border:0;border-radius:9px;padding:9px 12px;cursor:pointer;font-weight:700}.psv2-primary{background:var(--blue,#5B8CFF);color:#fff}.psv2-secondary{background:rgba(255,255,255,.08);color:inherit}.psv2-view> .psv2-primary{margin-top:14px}.psv2-search{display:flex;gap:8px;margin-bottom:15px}.psv2-search input{flex:1}.psv2-person{display:flex;align-items:center;gap:10px;padding:11px;border:1px solid rgba(255,255,255,.07);border-radius:12px;margin:7px 0}.psv2-person>div{flex:1}.psv2-person small{display:block;opacity:.45;margin-top:2px}.psv2-avatar{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:rgba(91,140,255,.14);font-weight:800}.psv2-view h4{font-size:10px;letter-spacing:.12em;text-transform:uppercase;opacity:.45;margin:20px 0 8px}.psv2-chat{display:grid;grid-template-columns:220px 1fr;min-height:480px;border:1px solid rgba(255,255,255,.07);border-radius:14px;overflow:hidden}.psv2-chat>aside{padding:8px;border-right:1px solid rgba(255,255,255,.07);overflow:auto}.psv2-chat-friend{display:block;width:100%;border:0;background:transparent;color:inherit;text-align:left;padding:10px;border-radius:9px}.psv2-chat-friend.active,.psv2-chat-friend:hover{background:rgba(91,140,255,.1)}.psv2-chat section{display:flex;flex-direction:column;min-width:0}.psv2-chat section>strong{padding:14px;border-bottom:1px solid rgba(255,255,255,.07)}#psv2Messages{flex:1;overflow:auto;padding:14px}.psv2-msg{max-width:72%;padding:9px 11px;border-radius:12px;background:rgba(255,255,255,.07);margin:6px 0;font-size:12px}.psv2-msg.mine{margin-left:auto;background:var(--blue,#5B8CFF);color:#fff}.psv2-msg small{display:block;font-size:8px;opacity:.55;margin-top:4px}.psv2-chat form{display:flex;gap:7px;padding:9px;border-top:1px solid rgba(255,255,255,.07)}.psv2-chat form input{flex:1}.psv2-account{display:flex;gap:8px;align-items:end}.psv2-account label{flex:1}.psv2-danger{margin-top:16px;padding:16px;border:1px solid rgba(255,80,90,.2);border-radius:14px;display:flex;justify-content:space-between;gap:15px;align-items:center}.psv2-danger p{margin:5px 0 0;opacity:.5;font-size:11px}.psv2-danger button{background:rgba(255,80,90,.14);color:#ff6975}.pressure-reduced-motion *{animation:none!important;transition:none!important;scroll-behavior:auto!important}.pressure-no-animations *{animation:none!important}.psv2 i{opacity:.45;font-size:12px}@media(max-width:700px){.psv2-grid,.psv2-chat{grid-template-columns:1fr}.psv2-chat>aside{border-right:0;border-bottom:1px solid rgba(255,255,255,.07);max-height:130px}.psv2-account,.psv2-danger{flex-direction:column;align-items:stretch}}
'''
          if 'PRESSURE SOCIAL SETTINGS UPGRADE v2' not in js: js += J
          if 'PRESSURE SOCIAL SETTINGS CSS v2' not in css: css += C
          Path('script.js').write_text(js,encoding='utf-8');Path('style.css').write_text(css,encoding='utf-8')
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add script.js style.css
          git rm .github/workflows/pressure-ui-live-upgrade.yml
          git commit -m 'feat: profile personalization friends realtime chat' || exit 0
          git push