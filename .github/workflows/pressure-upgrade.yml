name: Apply PRESSURE OFF upgrade
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply upgrade
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('script.js')
          s=p.read_text(encoding='utf-8')
          marker='/* PRESSURE OFF SOCIAL APPEARANCE UPGRADE */'
          if marker not in s:
              addon=r'''

/* PRESSURE OFF SOCIAL APPEARANCE UPGRADE */
(function(){
const P={g:id=>document.getElementById(id),e:v=>typeof escapeHtml==='function'?escapeHtml(String(v??'')):String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c]))};
const D={theme:'midnight',accent:'#5B8CFF',density:'comfortable',motion:false};let S={...D};
function k(){return currentUser?'pressure-off-settings-'+currentUser.id:null}function load(){try{S={...D,...JSON.parse(localStorage.getItem(k())||'{}')}}catch{};apply()}function save(){localStorage.setItem(k(),JSON.stringify(S));apply()}function apply(){document.documentElement.style.setProperty('--user-accent',S.accent);document.body.classList.toggle('po-light',S.theme==='light');document.body.classList.toggle('po-cozy',S.density==='cozy');document.body.classList.toggle('po-compact',S.density==='compact');document.documentElement.classList.toggle('po-reduced-motion',!!S.motion)}
function css(){if(P.g('poCSS'))return;let s=document.createElement('style');s.id='poCSS';s.textContent=`:root{--user-accent:#5B8CFF}.po-back{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.72);backdrop-filter:blur(10px)}.po-modal{width:min(760px,100%);max-height:90vh;overflow:auto;padding:24px;border-radius:24px;background:#151D32;border:1px solid rgba(255,255,255,.1)}.po-head{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:20px}.po-head h2{margin:0}.po-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.po-set{padding:16px;border:1px solid rgba(255,255,255,.08);border-radius:15px}.po-set label{display:block;font-size:11px;opacity:.65;margin-bottom:7px}.po-set select,.po-set input[type=color]{width:100%;padding:10px;border-radius:10px;background:#0F172A;color:white;border:1px solid rgba(255,255,255,.1)}.po-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.po-danger{margin-top:18px;padding:16px;border-radius:15px;border:1px solid rgba(255,105,105,.25)}.po-danger button{padding:9px 12px;border-radius:9px;background:rgba(255,105,105,.1);border:1px solid rgba(255,105,105,.3);color:#ff8a8a}.po-light{background:#f4f7fc}.po-light .card,.po-light .profile-hero-card,.po-light .profile-stat-card{background:#fff;color:#172033}.po-cozy .card{padding:30px}.po-compact .card{padding:18px}.po-reduced-motion *{transition:none!important;animation:none!important}@media(max-width:700px){.po-grid{grid-template-columns:1fr}.po-modal{padding:18px}}`;document.head.appendChild(s)}
function modal(title,body,actions=''){css();let old=P.g('poModal');if(old)old.remove();let w=document.createElement('div');w.id='poModal';w.className='po-back';w.innerHTML=`<div class="po-modal"><div class="po-head"><h2>${P.e(title)}</h2><button class="ghost-button" id="poX">✕</button></div>${body}${actions}</div>`;document.body.appendChild(w);P.g('poX').onclick=()=>w.remove();return w}
function settings(){let b=`<div class="po-grid"><div class="po-set"><label>Theme</label><select id="poTheme"><option value="midnight">Midnight</option><option value="light">Light</option></select></div><div class="po-set"><label>Accent</label><input id="poAccent" type="color" value="${P.e(S.accent)}"></div><div class="po-set"><label>Dashboard density</label><select id="poDensity"><option value="compact">Compact</option><option value="comfortable">Comfortable</option><option value="cozy">Cozy</option></select></div><div class="po-set"><label>Reduced motion</label><input id="poMotion" type="checkbox"></div></div><div class="po-danger"><strong>Danger zone</strong><p>Delete your account permanently.</p><button id="poDelete">Delete my account</button></div>`;let w=modal('Appearance & account',b,`<div class="po-actions"><button class="ghost-button" id="poCancel">Cancel</button><button class="primary-button" id="poSave">Save changes</button></div>`);P.g('poTheme').value=S.theme;P.g('poAccent').value=S.accent;P.g('poDensity').value=S.density;P.g('poMotion').checked=S.motion;P.g('poCancel').onclick=()=>w.remove();P.g('poSave').onclick=()=>{S={theme:P.g('poTheme').value,accent:P.g('poAccent').value,density:P.g('poDensity').value,motion:P.g('poMotion').checked};save();w.remove()};P.g('poDelete').onclick=deleteOwn}
async function deleteOwn(){if(!confirm('Delete your account permanently?'))return;const{data}=await supabaseClient.auth.getSession();if(!data?.session){alert('Session expired.');return}try{let r=await fetch(`${SUPABASE_URL}/functions/v1/delete-my-account`,{method:'POST',headers:{'Authorization':`Bearer ${data.session.access_token}`,'Content-Type':'application/json'},body:'{}'}),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Account deletion failed.');await supabaseClient.auth.signOut();localStorage.removeItem(k());location.reload()}catch(e){alert(e.message)}}
function social(){let b=`<div><div class="po-grid"><div class="po-set"><label>Find a friend by username</label><input id="poFriend" style="width:100%;padding:10px;border-radius:10px;background:#0F172A;color:white;border:1px solid rgba(255,255,255,.1)"><button class="primary-button" id="poFind" style="margin-top:8px">Find user</button></div><div class="po-set"><strong>Live chat</strong><p style="opacity:.6">Realtime friends + chat can run through Supabase Realtime once the friends/messages tables are enabled.</p></div></div><div id="poResult" style="margin-top:15px"></div></div>`;let w=modal('Friends & chat',b);P.g('poFind').onclick=async()=>{let u=P.g('poFriend').value.trim();if(!u)return;let{data,error}=await supabaseClient.from('profiles').select('id,username,name').ilike('username',u).limit(1);if(error||!data?.length){P.g('poResult').textContent='User not found.';return}let x=data[0];if(x.id===currentUser.id){P.g('poResult').textContent='That is you.';return}P.g('poResult').innerHTML=`<div class="po-set"><strong>${P.e(x.name||x.username)}</strong><p>@${P.e(x.username)}</p><button class="primary-button" id="poAdd">Add friend</button></div>`;P.g('poAdd').onclick=async()=>{let{error:e}=await supabaseClient.from('friendships').insert({requester_id:currentUser.id,addressee_id:x.id,status:'pending'});alert(e?e.message:'Friend request sent.')}}
function controls(){if(!profilePage||P.g('poControls'))return;let c=document.createElement('section');c.id='poControls';c.className='card';c.style.marginBottom='20px';c.innerHTML=`<div class="card-heading" style="margin-bottom:0"><div><p class="eyebrow">PERSONALIZE</p><h2>Profile controls</h2><p class="muted">Customize your dashboard and connect with friends.</p></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="small-add" id="poAppearance">⚙ Appearance</button><button class="small-add" id="poSocial">👥 Friends & chat</button></div></div>`;let q=profilePage.querySelector('.profile-container');if(q)q.insertBefore(c,q.firstElementChild);P.g('poAppearance').onclick=settings;P.g('poSocial').onclick=social}
css();load();controls();setTimeout(controls,600);window.poOpenSettings=settings;window.poOpenSocial=social;
})();
'''
              p.write_text(s+addon,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js
          git diff --cached --quiet || git commit -m "Add profile appearance account and social UI"
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/pressure-upgrade.yml
          git commit -m "Remove temporary upgrade workflow"
          git push
